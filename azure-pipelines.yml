trigger:
  batch: true
  branches:
    include:
      - "master"

pr: none

variables:
- group: Release Management Resources
- group: RELEASE das-shared-infrastructure

resources:
  repositories:
  - repository: self
  - repository: das-platform-building-blocks
    type: github
    name: SkillsFundingAgency/das-platform-building-blocks
    ref: refs/tags/3.0.16
    endpoint: SkillsFundingAgency
  - repository: das-platform-automation
    type: github
    name: SkillsFundingAgency/das-platform-automation
    ref: refs/tags/5.1.21
    endpoint: SkillsFundingAgency

stages:
- stage: Build
  jobs:
  - template: pipeline-templates/code-build.yml

- stage: Deploy_DTA
  dependsOn: Build
  displayName: Deploy to DTA
  variables:
  - group: DTA das-shared-infrastructure
  jobs:
  - template: pipeline-templates/deploy.yml
    parameters:
      ServiceConnection: SFA-DAS-DevTest-ARM
      Environment: DTA
      SubscriptionAbbreviation: DTA

- stage: Deploy_DEV
  dependsOn: Build
  displayName: Deploy to DEV
  variables:
  - group: DEV das-shared-infrastructure
  jobs:
  - template: pipeline-templates/deploy.yml
    parameters:
      ServiceConnection: SFA-DAS-DevTest-ARM
      Environment: DEV
      SubscriptionAbbreviation: DEV
      TimeoutInMinutes: 180

- stage: Deploy_AT
  dependsOn: Deploy_DEV
  condition: and(eq(dependencies.Deploy_DEV.result, 'Skipped'), not(canceled()))
  displayName: Deploy to AT
  variables:
  - group: DEV das-shared-infrastructure
  - group: AT das-shared-infrastructure
  jobs:
  - template: pipeline-templates/deploy.yml
    parameters:
      ServiceConnection: SFA-DAS-DevTest-ARM
      Environment: DEV
      SubscriptionAbbreviation: DEV

- stage: Deploy_TEST
  condition: and(not(succeededOrFailed('Deploy_DEV')), not(canceled()))
  displayName: Deploy to TEST
  variables:
  - group: DEV das-shared-infrastructure
  - group: TEST das-shared-infrastructure
  jobs:
  - template: pipeline-templates/deploy.yml
    parameters:
      ServiceConnection: SFA-DAS-DevTest-ARM
      Environment: DEV
      SubscriptionAbbreviation: DEV

- stage: Deploy_TEST2
  condition: and(not(succeededOrFailed('Deploy_DEV')), not(canceled()))
  displayName: Deploy to TEST2
  variables:
  - group: DEV das-shared-infrastructure
  - group: TEST2 das-shared-infrastructure
  jobs:
  - template: pipeline-templates/deploy.yml
    parameters:
      ServiceConnection: SFA-DAS-DevTest-ARM
      Environment: DEV
      SubscriptionAbbreviation: DEV

- stage: Deploy_DEMO
  condition: and(not(succeededOrFailed('Deploy_DEV')), not(canceled()))
  displayName: Deploy to DEMO
  variables:
  - group: DEV das-shared-infrastructure
  - group: DEMO das-shared-infrastructure
  jobs:
  - template: pipeline-templates/deploy.yml
    parameters:
      ServiceConnection: SFA-DAS-DevTest-ARM
      Environment: DEV
      SubscriptionAbbreviation: DEV

- stage: Deploy_PREPROD
  dependsOn: Build
  displayName: Deploy to PREPROD
  variables:
  - group: PREPROD das-shared-infrastructure
  jobs:
  - template: pipeline-templates/deploy.yml
    parameters:
      ServiceConnection: SFA-DIG-PreProd-ARM
      Environment: PREPROD
      SubscriptionAbbreviation: PP

- stage: Deploy_PROD
  dependsOn: Build
  displayName: Deploy to PROD
  variables:
  - group: PROD das-shared-infrastructure
  jobs:
  - template: pipeline-templates/deploy.yml
    parameters:
      ServiceConnection: SFA-DIG-Prod-ARM
      Environment: PROD
      SubscriptionAbbreviation: PRD

- stage: Deploy_MO
  dependsOn: Build
  displayName: Deploy to MO
  variables:
  - group: MO das-shared-infrastructure
  jobs:
  - template: pipeline-templates/deploy.yml
    parameters:
      ServiceConnection: SFA-ASM-ModelOffice-ARM
      Environment: MO
      SubscriptionAbbreviation: MO
